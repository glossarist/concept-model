%YAML 1.1
---
$id: "https://github.com/glossarist/concept-model/v3/concept"
title: YAML Schema for Concept model (v3)
description: |
  A metaschema for glossarist concept model V3.
type: object
properties:
  id:
    type: string
    description: A management identifier for the concept
    examples:
      - '1234'
      - 12969ded-ba28-48de-b009-1f1140236c60
  data:
    type: object
    description: Data related to the concept
    properties:
      identifier:
        type: string
        description: A unique identifier for the concept
        examples:
          - "1234"
          - "foobar"
      uri:
        type: string
        description: Optional URI for the concept
        examples:
          - "https://example.org/concepts/1234"
      localized_concepts:
        type: object
        description: Three digit language code followed by the `id` of the 
          localization for that language.
        examples:
          - eng: '1234'
          - ara: 39fcd2af-9ef1-4a69-71a4-2d3de569afce
        propertyNames:
          $ref: "#/$defs/iso639_three_char_code"
        additionalProperties:
          type: string
      domains:
        type: array
        items:
          $ref: "#/$defs/reference"
        description: Domain/subject area references (replaces legacy groups 
          field).
      tags:
        type: array
        items:
          type: string
        description: Organizational tags for grouping and filtering concepts 
          (not rendered as terminological domains).
      sources:
        type: array
        items:
          $ref: "#/$defs/concept_source"
        description: Zero or more bibliographical sources for the term.
      dates:
        type: array
        items:
          $ref: "#/$defs/concept_date"
        description: Dates in the lifecycle of the management of the term.
  related:
    type: array
    items:
      $ref: "#/$defs/related_concept"
    description: |
      Zero or more binary related concepts at the concept level.

      For one-to-many n-ary decompositions (ISO 704 rake diagrams),
      use the per-file relation format under `relations/<id>/`.
      See `schemas/v3/relation.yaml` and `docs/design/relations-as-files.md`.

  sources:
    type: array
    items:
      $ref: "#/$defs/concept_source"
    description: Concept-level bibliographical sources.
  dates:
    type: array
    items:
      $ref: "#/$defs/concept_date"
    description: Concept-level governance dates (lifecycle events).
  status:
    $ref: "#/$defs/concept_status"
  concept_type:
    $ref: "#/$defs/concept_type"
  date_accepted:
    type: string
    format: date-time
    description: Date and time when the concept was accepted.
    examples:
      - "2021-05-01T00:00:00+00:00"

additionalProperties: false

allOf:
  # ExternalConcept conditional: when status is 'external', the
  # data block must NOT include definition or sources (those would
  # contradict the external status). When status is anything else,
  # the data block must include designations and definition per
  # the normal ManagedConcept contract.
  - if:
      properties:
        status:
          const: external
    then:
      properties:
        data:
          properties:
            definition:
              not: {}
            sources:
              not: {}
          required: [identifier, designations]

$defs:
  # ISO 639-3 three-letter language code (used by localized_concepts
  # propertyNames and criterion propertyNames)
  iso639_three_char_code:
    type: string
    pattern: "^[a-z]{3}$"
    description: ISO 639-3 three-letter language code (e.g. "eng", "fra").

  # Concept Status enum
  concept_status:
    type: string
    description: The normative status of the managed term.
    enum:
      - draft
      - submitted
      - not_valid
      - invalid
      - valid
      - superseded
      - retired
      - external

  # Concept Type enum (ISO 704:2022 §5.2-5.3)
  concept_type:
    type: string
    description: |
      Whether the concept corresponds to a category of objects
      (`general`) or to a single unique object (`individual`).

      Per ISO 704:2022 §5.2-5.3:
        - General concepts are designated by terms or symbols
        - Individual concepts are designated by proper names
          (appellations) or symbols

      Individual concepts occupy the bottom rung of a concept ladder
      and cannot be subdivided into more specific concepts, but CAN
      be subdivided into parts via a partitive relation.

      Defaults to `general` when omitted.
    enum:
      - general
      - individual

  # Concept Date
  concept_date:
    type: object
    description: A date relevant to the lifecycle of the managed term.
    properties:
      date:
        type: string
        format: date
        description: The date associated with the managed term.
      type:
        $ref: "#/$defs/concept_date_type"
    required:
      - date
      - type

  # Concept Date Type enum
    additionalProperties: false
  concept_date_type:
    type: string
    description: Kinds of governance events associated with the lifecycle of a 
      managed term.
    enum:
      - accepted
      - amended
      - retired
      - review
      - review_decision

  # Related Concept
  related_concept:
    type: object
    description: A concept related to the current concept with a typed 
      relationship.
    properties:
      type:
        $ref: "#/$defs/related_concept_type"
      ref:
        $ref: "#/$defs/concept_ref"
      content:
        type: object
        additionalProperties:
          type: string
        description: |
          Free-form localized text describing the relationship, keyed
          by ISO 639 language code: `{ "eng": "...", "fra": "..." }`.

          All free-form text fields in Glossarist are localized —
          the project is multi-language by domain. Plain strings are
          NOT accepted; wrap single-language text as
          `{ "eng": "..." }`.

  # Related Concept Type enum
    additionalProperties: false
  related_concept_type:
    type: string
    description: The relation of a term to the current term.
    enum:
      # Lifecycle (ISO 10241-1 / ISO 19135)
      - deprecates
      - deprecated_by
      - supersedes
      - superseded_by
      - replaces
      - replaced_by
      - invalidates
      - invalidated_by
      - retires
      - retired_by
      # Hierarchical — generic (SKOS)
      - broader
      - narrower
      - broader_generic
      - narrower_generic
      # Hierarchical — partitive (ISO 25964 / ISO 19135)
      - broader_partitive
      - narrower_partitive
      - has_part
      - is_part_of
      # Hierarchical — instantial (ISO 25964 / ISO 19135)
      - broader_instantial
      - narrower_instantial
      - instance_of
      - has_instance
      # Equivalence (ISO 10241-1 / SKOS)
      - equivalent
      - exact_match
      # Approximate / mapping (SKOS)
      - close_match
      - broad_match
      - narrow_match
      - related_match
      # Associative (ISO 10241-1 / ISO 25964)
      - see
      - references
      - related_concept
      - related_concept_broader
      - related_concept_narrower
      # Associative — contiguity subtype (ISO 704:2022 §5.5.5 Table 1)
      - enhances                     # tool – accessory (smartphone – selfie stick)
      - enhanced_by
      - contains                     # container – contained (milk carton – milk)
      - contained_by_container
      - contained_by_contained       # contained – contained (fish – shellfish re: sea)
      - attaches                     # tool – connection (screen – HDMI port)
      - attached_to
      - made_of                      # concrete item – material (seawater – salt)
      - material_of
      - has_property                 # material – state (air – humidity)
      - property_of
      - owns                         # object – owner (enterprise – state)
      - owned_by
      - ranks_above                  # rank (chair – vice-chair)
      - ranks_below
      # Associative — sequential subtype (ISO 704:2022 §5.5.5 Table 1)
      - causes                       # cause – effect (humidity – corrosion)
      - caused_by
      - develops_into                # developmental (tadpole – frog)
      - develops_from
      # Associative — activity subtype
      - performed_by                 # action – actor (energy conversion – energy)
      - performs_action
      - done_by_method               # action – method (teach – e-learning)
      - method_of
      - done_at                      # action – place (teach – school)
      - place_of_action
      - done_for_purpose             # action – objective (medical exam – diagnosis)
      - purpose_of_action
      - done_for_beneficiary         # action – beneficiary (discharge – patient)
      - beneficiary_of_action
      - acts_on_object               # action – object (learn – school)
      - object_of_action
      - done_with_tool               # action – instrument (click – mouse)
      - tool_of_action
      - acts_on_patient              # action – patient (psychotherapy – client)
      - patient_of_action
      # Associative — instrumental subtype
      - produces                     # producer – product (baker – bread)
      - produced_by
      - made_from_ingredient         # raw material – product (wood – desk)
      - ingredient_of
      - produced_by_instrument       # tool – product (oven – bread)
      - instrument_product_of
      - employed_by_professional     # professional – tool (painter – brush)
      - employs_tool
      - handled_by_tool              # object – tool for handling (time – clock)
      - tool_handles
      - applied_to_patient           # tool – patient (baby sling – baby)
      - patient_of_tool
      # Associative — interactional subtype
      - controlled_by                # controlled – controller (pointer – mouse)
      - controls
      - represented_by               # entity – representative (length – metre)
      - represents
      # Associative — origination subtype
      - originates_from              # producer/product alias
      - origin_of
      # Associative — transmission subtype
      - sends_to                     # sender – receiver (satellite – dish)
      - receives_from
      - sends_object                 # sender – object (phone – text message)
      - object_sent_by
      # Associative — opposite subtype
      - opposite_of                  # bidirectional (encoding – decoding)
      # Comparative (ISO 10241-1)
      - compare
      - contrast
      # Spatiotemporal (ISO 25964 / TBX)
      - sequentially_related
      - spatially_related
      - temporally_related
      # Lexical (ISO 12620 / TBX)
      - homograph
      - false_friend
      # Register management (ISO 19135)
      - has_concept
      - is_concept_of
      - has_definition
      - definition_of
      - inherits
      - inherited_by
      # Versioning / definitional (ISO 19135)
      - has_version
      - version_of
      - current_version
      - current_version_of
      # Designation-level (ISO 10241-1)
      - abbreviated_form_for
      - short_form_for
      # ExternalConcept resolution (Glossarist extension)
      - provides
      - provided_by

  # Reference (typed classification — domains, typed references)
  reference:
    type: object
    description: |
      A typed reference to an item within a collection. Used for domain
      classification and typed references. For bibliographic citations,
      use citation; for concept links in relationships, use concept_ref.
    properties:
      source:
        type: string
        description: Collection identifier (document series, termbase, 
          vocabulary).
      id:
        type: string
        description: Item identifier within the collection (document ID, concept
          ID).
      concept_id:
        type: string
        description: Alias for id (backward compatibility).
      version:
        type: string
        description: Version of the item or collection.
      locality:
        $ref: "#/$defs/locality"
      link:
        type: string
        description: URL link to the source document or concept.
      original:
        type: string
        description: Pre-parsed original text.
      custom_locality:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            value:
              type: string
      ref_type:
        type: string
        description: Type qualifier (domain, local, urn, designation).
      urn:
        type: string
        description: Direct URN reference.
      term:
        type: string
        description: Term text when referencing a concept.

  # Citation (bibliographic — used in ConceptSource#origin)
    additionalProperties: false
  citation:
    type: object
    description: |
      A bibliographic citation. The `ref` field is always a structured hash
      (Citation::Ref) identifying the source document. This is the V3 canonical
      format — plain string refs are supported only via V2 backward compatibility.
    properties:
      ref:
        $ref: "#/$defs/citation_ref"
      locality:
        $ref: "#/$defs/locality"
      link:
        type: string
        description: URL link to the source document.
      original:
        type: string
        description: Pre-parsed original citation text.
      custom_locality:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            value:
              type: string

  # Citation::Ref (always a hash in V3)
  citation_ref:
    type: object
    description: |
      Inner reference of a Citation. Always a structured hash with source,
      id, and optional version. Never a plain string in V3.
    properties:
      source:
        type: string
        description: Document series or termbase (e.g. "ISO", "IEC").
      id:
        type: string
        description: Document identifier within the series (e.g. "1087-1:2000").
      version:
        type: string
        description: Version of the document.

  # ConceptRef (used in RelatedConcept#ref, PartitiveMember#ref,
  # presence, count, and is_delimiting, and standalone as ExternalConcept placeholder)
  concept_ref:
    type: object
    description: |
      A concept reference. Three forms:
        1. (source, id, text) — fully resolved, with optional
           display text
        2. (source, id) — resolved
        3. (text) — text-only placeholder for an ExternalConcept
           (ManagedConcept with status: external)

      Form 3 is for inline convenience in authored YAML. The
      deserializer creates or looks up an ExternalConcept with
      that text as its preferred designation.
    properties:
      source:
        type: string
        description: Registry or vocabulary identifier (e.g. "IEC", "ISO").
      id:
        type: string
        description: Concept identifier within the registry (e.g. "102-01-01").
      text:
        type: string
        description: Target designation text for lexical relationships, or the placeholder label for an unresolved ExternalConcept.
    anyOf:
      - required: [source, id]
      - required: [text]
    additionalProperties: false

  # Completeness enum
  completeness:
    type: string
    description: |
      Whether the partitives of a PartitiveRelation fitted together
      constitute the whole comprehensive concept (complete) or only
      some of it (partial — other partitives exist that are not
      encoded).
    enum:
      - complete
      - partial

  # Partitive Presence enum (ISO 704:2022 — solid vs dashed line)
  partitive_presence:
    type: string
    description: |
      Whether this partitive member must exist in every instance
      (required) or may exist in some instances only (optional).

      ISO 704:2022 encodes this as the line style: solid (required)
      vs dashed (optional). Defaults to required when omitted.
    enum:
      - required
      - optional

  # Partitive Count enum (ISO 704:2022 — single vs double line)
  partitive_count:
    type: string
    description: |
      How many instances of this partitive member exist.

      ISO 704:2022 encodes this via the number of lines in the
      diagram notation (1 line = exactly_one or at_least_one;
      2 lines = multiple). Defaults to exactly_one when omitted.

      The combination presence: optional + count: at_least_one is
      invalid — if a part is optional, at_least_one is vacuous and
      collapses to (optional, multiple).
    enum:
      - exactly_one
      - at_least_one
      - multiple

  # Concept reference — used by RelatedConcept, ExternalConcept
  # placeholders, and (via relation.yaml#$defs/concept_system_member)
  # by members of n-ary Partitive / Generic relations.

  # Definition Type enum (ISO 704:2022 §5.3)
  definition_type:
    type: string
    description: |
      The definition strategy, per ISO 704:2022 §5.3. Used on
      DetailedDefinition#type. Defaults to intensional when omitted.

      See docs/design/definition-types.md for the rationale and
      rendering guidance per type.
    enum:
      - intensional
      - extensional
      - partitive
      - translated

  # Locality
  locality:
    type: object
    description: A locality within a cited document.
    properties:
      type:
        type: string
        description: Type of the locality (section, clause, page, etc.)
      reference_from:
        type: string
      reference_to:
        type: string
    additionalProperties: false

  # Concept Source Type enum
  concept_source_type:
    type: string
    description: Type of concept source.
    enum:
      - authoritative
      - lineage

  # Concept Source Status enum
  concept_source_status:
    type: string
    description: The status of the managed term relative to the source.
    enum:
      - identical
      - similar
      - modified
      - restyle
      - context_added
      - generalisation
      - specialisation
      - unspecified
      - related
      - not_equal

  # Concept Source
  concept_source:
    type: object
    description: |
      Bibliographic reference for a concept or designation.
      May carry an optional `id` for inline reference via
      `{{cite:id}}` mentions in the concept's text.
    properties:
      id:
        type: string
        description: |
          Optional stable identifier for the source, used by
          inline `{{cite:id}}` references in the concept's
          text. The id is local to the concept; it must be
          unique within the concept's sources list (across
          concept-level, localization-level, and
          designation-level sources).
      type:
        $ref: "#/$defs/concept_source_type"
      status:
        $ref: "#/$defs/concept_source_status"
      origin:
        $ref: "#/$defs/citation"
      modification:
        type: string
        description: How the concept was modified from the source.
      sourced_from:
        type: array
        description: |
          Citations to the documents that this source was itself sourced
          from. Only valid on sources of type `lineage`; authoritative
          sources are terminal. When present, `status` and `modification`
          describe how `origin` relates to these upstream sources.
          Each citation MUST include a `locality` so the reader can
          locate the definition in the upstream document.
        items:
          allOf:
            - $ref: "#/$defs/citation"
          required:
            - ref
            - locality
    additionalProperties: false